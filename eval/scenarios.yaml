# Trip-planning scenarios for eval/plans.py. Every check is computed in code from the plan.
#   text      what the traveller types
#   followup  answer if the planner asks for missing details
#   expect    days: plan length; towns: destination ids the plan must include (and the
#             circuit offered first should cover); veg: no meat/fish/bar eateries;
#             budget: cost must fit or the plan must say it does not; health: a high-altitude
#             health note is required (vulnerable travellers going above 2,500 m)
scenarios:
  - {id: p01, text: "3 days in Haridwar and Rishikesh for 2 people in November, temples and local food",
     expect: {days: 3, towns: [destination_haridwar, destination_rishikesh]}}
