name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Storage tests run against SQLite and this Postgres (the production backend).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tb
          POSTGRES_PASSWORD: tb
          POSTGRES_DB: travelbuddy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tb" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          SECRET_KEY: ci-secret-key-at-least-16-chars
          TEST_DATABASE_URL: postgresql://tb:tb@localhost:5432/travelbuddy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uttarakhand-planner .

  # Quality gate: runs the golden set against the live knowledge base. Needs repository
  # secrets; skipped on pull requests from forks, which cannot read secrets.
  eval:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: neo4j
      SECRET_KEY: ci-secret-key-at-least-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m eval.run --systems self_rag
      - run: python -m eval.gate
      - run: python -m eval.plans
      - run: python -m eval.gate --plans
      - run: python -m eval.redteam  # exits non-zero if any attack succeeds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            eval/RESULTS.md
            eval/PLANS.md
            eval/REDTEAM.md
            eval/results/*.json

  deploy:
    runs-on: ubuntu-latest
    needs: [docker, eval]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger deploy (Render deploy hook)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "No RENDER_DEPLOY_HOOK_URL secret set; skipping deploy."; exit 0; fi
          curl -fsS -X POST "$HOOK"
