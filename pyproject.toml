[project]
name = "uttarakhand-planner"
version = "0.1.0"
description = "Agentic end-to-end Uttarakhand trip planner (LangGraph, MCP, Self-RAG)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"ingest/*" = ["E501"]
"tests/*" = ["E501"]
"app/graph/*" = ["E501"]
