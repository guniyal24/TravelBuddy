# The town registry: every destination the app knows, read by the ingest pipeline and the app
# (app/towns.py). Add a town here, run `python -m ingest.build --only <id> --merge`, load it,
# then set `offer: true` once the quality report shows at least one stay and two places.
#
#   wikivoyage_page  source of listings with descriptions and prices (optional)
#   osm_places       also take places from OpenStreetMap (for towns Wikivoyage covers thinly)
#   lat, lon         approximate town centre; elevation_m approximate sleeping altitude
#   themes           words matched against a traveller's interests by the circuit advisor
#   aliases          other spellings, Hinglish and Devanagari names (matched in code)
#   station          nearest useful railway station [code, name]; region decides the airport
#   offer            whether the planner offers it (needs enough data)
destinations:
