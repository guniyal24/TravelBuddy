  - {a: destination_haridwar,  b: destination_mussoorie, km: 90,  hours: [2.5, 3.5]}
  - {a: destination_nainital,  b: destination_almora,    km: 67,  hours: [2, 3]}
  - {a: destination_nainital,  b: destination_ranikhet,  km: 60,  hours: [2, 3]}
