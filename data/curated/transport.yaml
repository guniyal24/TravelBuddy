  - {a: destination_haridwar,  b: destination_rishikesh, km: 25,  hours: [0.75, 1.25]}
  - {a: destination_haridwar,  b: destination_dehradun,  km: 55,  hours: [1.5, 2.5]}
  - {a: destination_rishikesh, b: destination_dehradun,  km: 45,  hours: [1, 2]}
  - {a: destination_dehradun,  b: destination_mussoorie, km: 35,  hours: [1.25, 2]}
