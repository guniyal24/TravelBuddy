# Road links between origin cities and Uttarakhand destinations, and between destinations.
# km / hours are approximate author estimates (confidence: curated_unverified) taken from
# common road distances; hours are (low, high) for a normal day and exclude breaks and jams.
# Departure times are deliberately NOT stored: they change and must come from the operator
# (Uttarakhand Transport Corporation: https://utconline.uk.gov.in , IRCTC for trains).
# Fares are computed from per-km assumptions in app/transport/routes.py and labelled as such.
confidence: curated_unverified
sources:
  bus: https://utconline.uk.gov.in
  rail: https://www.irctc.co.in
cities:
  city_delhi: Delhi
routes:
  # --- from Delhi (road; direct trains also run to the rail heads listed) ---
  - {a: city_delhi, b: destination_haridwar,    km: 215, hours: [5, 6.5],  rail: HW}
  - {a: city_delhi, b: destination_rishikesh,   km: 240, hours: [6, 7.5],  rail: YNRK, note: "Rail head Haridwar (HW) is more served; Yog Nagari Rishikesh has fewer trains."}
  - {a: city_delhi, b: destination_dehradun,    km: 250, hours: [5.5, 7],  rail: DDN}
  - {a: city_delhi, b: destination_mussoorie,   km: 290, hours: [7, 9],    rail: DDN, note: "Reach Dehradun first, then 35 km uphill."}
  - {a: city_delhi, b: destination_nainital,    km: 305, hours: [7, 9],    rail: KGM, note: "Rail head Kathgodam, then 35 km uphill."}
  - {a: city_delhi, b: destination_jim_corbett, km: 240, hours: [6, 7.5],  rail: RMR, note: "Rail head Ramnagar; safari gates are 15-80 km further, by zone."}
  - {a: city_delhi, b: destination_almora,      km: 370, hours: [9, 11],   rail: KGM}
  - {a: city_delhi, b: destination_ranikhet,    km: 350, hours: [8.5, 10.5], rail: KGM}
